apiVersion: v1
kind: Namespace
metadata:
  name: registry-cache
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dockerhub-registry-cache
  namespace: registry-cache
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dockerhub-registry-cache
  namespace: registry-cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dockerhub-registry-cache
  template:
    metadata:
      labels:
        app: dockerhub-registry-cache
    spec:
      containers:
        - name: registry
          image: registry:2.8.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: registry
              containerPort: 5000
          env:
            - name: REGISTRY_PROXY_REMOTEURL
              value: https://registry-1.docker.io
            - name: REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY
              value: /var/lib/registry
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dockerhub-registry-cache
---
apiVersion: v1
kind: Service
metadata:
  name: dockerhub-registry-cache
  namespace: registry-cache
spec:
  type: NodePort
  selector:
    app: dockerhub-registry-cache
  ports:
    - name: registry
      port: 5000
      targetPort: registry
      nodePort: 30500
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ghcr-registry-cache
  namespace: registry-cache
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghcr-registry-cache
  namespace: registry-cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ghcr-registry-cache
  template:
    metadata:
      labels:
        app: ghcr-registry-cache
    spec:
      containers:
        - name: registry
          image: registry:2.8.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: registry
              containerPort: 5000
          env:
            - name: REGISTRY_PROXY_REMOTEURL
              value: https://ghcr.io
            - name: REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY
              value: /var/lib/registry
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ghcr-registry-cache
---
apiVersion: v1
kind: Service
metadata:
  name: ghcr-registry-cache
  namespace: registry-cache
spec:
  type: NodePort
  selector:
    app: ghcr-registry-cache
  ports:
    - name: registry
      port: 5000
      targetPort: registry
      nodePort: 30501
